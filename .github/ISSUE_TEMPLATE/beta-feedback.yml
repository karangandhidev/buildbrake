name: Beta feedback
description: Report first-run friction or whether BuildBrake helped with a real task.
title: "[Beta]: "
labels: ["beta-feedback"]
body:
  - type: markdown
    attributes:
      value: Thanks for testing BuildBrake. Do not paste private source code, credentials, or an unredacted receipt.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows or WSL]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BuildBrake version
      description: Run `bb --version`.
      placeholder: BuildBrake 0.1.0
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe the task without including private code.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What was confusing or wasteful?
      description: Include the first point where you needed help.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Did the result prove the stated outcome?
      options: ["Yes", "No", "I could not tell"]
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Would you use this instead of running Codex directly?
      description: Tell us why or why not.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Optional receipt ID, `bb doctor` output, or error. Remove private paths and project content.
      render: shell
