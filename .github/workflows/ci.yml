name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/buildbrake-smoke
          /tmp/buildbrake-smoke/bin/pip install dist/*.whl
          /tmp/buildbrake-smoke/bin/bb --version
          /tmp/buildbrake-smoke/bin/buildbrake --help
